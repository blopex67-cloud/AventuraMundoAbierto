name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional build note
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: auto
          targetPlatform: Android
          buildMethod: AdventureBuild.BuildAndroid
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AventuraMundoAbierto-Android
          path: unity/Build/AventuraMundoAbierto.apk
          if-no-files-found: error
          retention-days: 14
