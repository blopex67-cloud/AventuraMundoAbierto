name: Build Android APK
on:
  workflow_dispatch: {}
jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.32f1
          targetPlatform: Android
          buildName: AventuraMundoAbierto
          buildsPath: Build
          customParameters: -executeMethod AdventureBuild.BuildAndroid
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AventuraMundoAbierto-Android
          path: Build/AventuraMundoAbierto.apk
          if-no-files-found: error
